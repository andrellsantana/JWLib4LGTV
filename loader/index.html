<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<title>JW Vídeos</title>
<style>html,body{margin:0;background:#010b2e;width:100%;height:100%;overflow:hidden}</style>
</head>
<body>
<div id="app"></div>
<script>
/*
 * Carregador do JW Vídeos (RF16).
 * Abre a versão publicada no GitHub Pages (sempre a mais nova, e com endereço
 * https, aceito pela API do JW.org). Sem internet ou sem publicação, usa a
 * cópia que veio no pacote (pasta app/).
 */
(function () {
  var REMOTE = '__REMOTE__'; // ex.: https://usuario.github.io/repositorio/
  var BUNDLED = 'app/';
  var done = false;

  function bundled() {
    if (done) return;
    done = true;
    window.__JWLV_VERSION__ = 'pacote';
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = BUNDLED + 'app.css';
    document.head.appendChild(link);
    var script = document.createElement('script');
    script.src = BUNDLED + 'app.js';
    document.body.appendChild(script);
    setTimeout(function () {
      if (document.getElementById('stage')) return;
      document.getElementById('app').innerHTML =
        '<div style="color:#eef2f6;font:32px sans-serif;padding:200px 160px;line-height:1.5">' +
        'O JW Vídeos não conseguiu abrir.<br>Verifique a internet da TV, feche o app e abra de novo.</div>';
    }, 20000);
  }

  if (REMOTE.indexOf('http') !== 0) return bundled();
  var x = new XMLHttpRequest();
  x.open('GET', REMOTE + 'version.json?t=' + Date.now());
  x.timeout = 6000;
  x.onload = function () {
    var info = null;
    try { info = JSON.parse(x.responseText); } catch (e) {}
    if (x.status === 200 && info && info.version && !done) {
      done = true;
      location.replace(REMOTE + 'index.html?v=' + encodeURIComponent(info.version));
    } else bundled();
  };
  x.onerror = x.ontimeout = bundled;
  x.send();
})();
</script>
</body>
</html>
